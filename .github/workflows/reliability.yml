name: Reliability checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://fixture.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-ci-key
